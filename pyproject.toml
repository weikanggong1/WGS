[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "torchwgs"
version = "0.1.0"
description = "PyTorch GPU quantitative-trait WGS single-variant and gene-based association"
requires-python = ">=3.9"
dependencies = ["torch>=2.0", "numpy>=1.24,<2", "scipy>=1.10", "pandas>=1.4", "triton>=2.0; platform_system == 'Linux'"]

[project.scripts]
torchwgs = "torchwgs.cli:main"

[tool.setuptools.packages.find]
include = ["torchwgs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
