[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torchstaar"
version = "0.3.1"
description = "Torchstaar: PyTorch STAAR/MultiSTAAR association and torchwgs REGENIE-compatible discovery"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = ["numpy>=1.26,<2", "scipy>=1.13", "torch>=2.4", "rdata==1.1.0", "xarray>=2024.1", "pandas>=1.4", "zstandard>=0.22", "triton>=3.0; platform_system == 'Linux'"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
torchwgs = "torchwgs.cli:main"
torchstaar = "torchstaar.cli:main"
torchstaar-prepare = "torchstaar.prepare:main"
torchstaar-chromosome = "torchstaar.chromosome:main"

[tool.setuptools.packages.find]
include = ["torchstaar*", "staar_phewas*", "torchwgs*"]

[tool.setuptools.package-data]
staar_phewas = ["_gds_flat.cpp", "_gds_packed.cpp"]
