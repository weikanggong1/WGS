[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "staar-phewas-torch"
version = "0.1.0"
description = "PyTorch WGS association: STAAR/MultiSTAAR PheWAS and REGENIE-compatible discovery"
requires-python = ">=3.10"
license = {text = "GPL-3.0-only"}
dependencies = ["numpy>=1.26,<2", "scipy>=1.13", "torch>=2.4", "rdata==1.1.0", "xarray>=2024.1", "pandas>=1.4", "triton>=2.0; platform_system == 'Linux'"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
torchwgs = "torchwgs.cli:main"
staar-phewas-torch = "staar_phewas.cli:main"
staar-phewas-prepare = "staar_phewas.prepare:main"

[tool.setuptools.packages.find]
include = ["staar_phewas*", "torchwgs*"]
